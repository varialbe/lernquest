# LernQuest – HTTP (nur ACME-Challenge + Weiterleitung auf HTTPS)
<VirtualHost *:80>
    ServerName lern.varialbe.xyz
    DocumentRoot /var/www/lernquest

    Alias /.well-known/acme-challenge/ /var/www/lernquest-acme/.well-known/acme-challenge/
    <Directory /var/www/lernquest-acme>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://lern.varialbe.xyz%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/lernquest-error.log
    CustomLog ${APACHE_LOG_DIR}/lernquest-access.log combined
</VirtualHost>
