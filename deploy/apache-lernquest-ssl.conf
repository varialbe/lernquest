# LernQuest – HTTPS: statische PWA aus /var/www/lernquest, /api → Fastify (127.0.0.1:3460)
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName lern.varialbe.xyz
    DocumentRoot /var/www/lernquest

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/lern.varialbe.xyz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/lern.varialbe.xyz/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # --- API (Reverse Proxy) ---
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        /api/ http://127.0.0.1:3460/api/ timeout=60
    ProxyPassReverse /api/ http://127.0.0.1:3460/api/

    # --- Statische App (SPA-Fallback) ---
    <Directory /var/www/lernquest>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>
    <Location /api/>
        FallbackResource disabled
    </Location>

    # --- Sicherheits-Header ---
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

    # --- Caching ---
    # gehashte Build-Dateien: für immer
    <LocationMatch "^/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css|woff2?|ttf)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    # Bilder (nicht gehasht): 1 Woche
    <LocationMatch "^/(assets|icons)/[^/]+\.(webp|png|svg)$">
        Header set Cache-Control "public, max-age=604800"
    </LocationMatch>
    # App-Shell, Service Worker, Manifest: immer revalidieren
    <LocationMatch "^/(index\.html|sw\.js|manifest\.webmanifest|registerSW\.js)?$">
        Header set Cache-Control "no-cache"
    </LocationMatch>
    <Location /api/>
        Header set Cache-Control "no-store"
    </Location>

    # --- Kompression (Brotli bevorzugt, sonst gzip) ---
    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/css text/plain application/javascript text/javascript application/json application/manifest+json image/svg+xml
    </IfModule>
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/plain application/javascript text/javascript application/json application/manifest+json image/svg+xml
    </IfModule>
    AddType application/manifest+json .webmanifest

    ErrorLog ${APACHE_LOG_DIR}/lernquest-error.log
    CustomLog ${APACHE_LOG_DIR}/lernquest-access.log combined
</VirtualHost>
</IfModule>
